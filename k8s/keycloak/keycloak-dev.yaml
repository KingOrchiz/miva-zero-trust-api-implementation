apiVersion: v1
kind: Secret
metadata:
  name: keycloak-admin
  namespace: irestrict-identity
type: Opaque
stringData:
  KEYCLOAK_ADMIN: admin
  KEYCLOAK_ADMIN_PASSWORD: irestrict-v3-lab-admin-change-after-test
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: keycloak
  namespace: irestrict-identity
spec:
  replicas: 1
  selector:
    matchLabels:
      app: keycloak
  template:
    metadata:
      labels:
        app: keycloak
    spec:
      containers:
        - name: keycloak
          image: keycloak/keycloak:26.0.7
          args: ["start-dev", "--http-port=8080"]
          envFrom:
            - secretRef:
                name: keycloak-admin
          ports:
            - containerPort: 8080
          readinessProbe:
            httpGet:
              path: /realms/master
              port: 8080
            initialDelaySeconds: 30
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /realms/master
              port: 8080
            initialDelaySeconds: 60
            periodSeconds: 20
---
apiVersion: v1
kind: Service
metadata:
  name: keycloak
  namespace: irestrict-identity
spec:
  selector:
    app: keycloak
  ports:
    - name: http
      port: 8080
      targetPort: 8080
