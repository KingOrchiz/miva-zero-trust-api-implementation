apiVersion: v1
kind: ServiceAccount
metadata:
  name: synthetic-client
  namespace: irestrict-apps
---
apiVersion: batch/v1
kind: Job
metadata:
  name: synthetic-client-smoke-test
  namespace: irestrict-apps
spec:
  template:
    metadata:
      labels:
        app: synthetic-client
        miva.openclaw.io/workload: test-client
    spec:
      restartPolicy: Never
      serviceAccountName: synthetic-client
      containers:
        - name: client
          image: curlimages/curl:8.10.1
          command: ["/bin/sh", "-c"]
          args:
            - |
              echo "Synthetic client placeholder. Final DPoP/mTLS tests are executed by scripts/run-validation-tests.sh after Keycloak and gateway are configured."
              curl -sS http://sample-financial-api.irestrict-apps.svc.cluster.local/healthz || true
  backoffLimit: 0
