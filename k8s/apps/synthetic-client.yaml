apiVersion: v1
kind: ServiceAccount
metadata:
  name: synthetic-client
  namespace: irestrict-apps
---
apiVersion: batch/v1
kind: Job
metadata:
  name: synthetic-client-smoke-test
  namespace: irestrict-apps
spec:
  template:
    metadata:
      labels:
        app: synthetic-client
        miva.openclaw.io/workload: test-client
    spec:
      restartPolicy: Never
      serviceAccountName: synthetic-client
      containers:
        - name: client
          image: curlimages/curl:8.10.1
          command: ["/bin/sh", "-c"]
          args:
            - |
              set -eu
              BASE=http://sample-financial-api.irestrict-apps.svc.cluster.local
              echo "T00 health"
              curl -fsS "$BASE/healthz"
              echo
              echo "T01 valid OPA decision"
              curl -fsS -H 'x-demo-scope: accounts.read' -H 'x-demo-dpop: true' -H 'x-demo-mtls: true' "$BASE/v1/accounts"
              echo
              echo "T02 missing DPoP should deny"
              code=$(curl -sS -o /tmp/t02.json -w '%{http_code}' -H 'x-demo-scope: accounts.read' -H 'x-demo-mtls: true' "$BASE/v1/accounts")
              cat /tmp/t02.json
              test "$code" = "403"
              echo
              echo "Synthetic client tests completed."
  backoffLimit: 0
