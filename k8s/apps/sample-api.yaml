apiVersion: v1
kind: ServiceAccount
metadata:
  name: sample-financial-api
  namespace: irestrict-apps
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: sample-financial-api
  namespace: irestrict-apps
spec:
  replicas: 2
  selector:
    matchLabels:
      app: sample-financial-api
  template:
    metadata:
      labels:
        app: sample-financial-api
        miva.openclaw.io/workload: protected-api
    spec:
      serviceAccountName: sample-financial-api
      containers:
        - name: api
          image: ghcr.io/kingorchiz/miva-sample-financial-api:placeholder
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8080
          env:
            - name: OTEL_EXPORTER_OTLP_ENDPOINT
              value: http://otel-collector.irestrict-observability.svc.cluster.local:4318
            - name: OPA_POLICY_ENDPOINT
              value: http://opa.irestrict-security.svc.cluster.local:8181/v1/data/miva/api/authz/allow
          readinessProbe:
            httpGet:
              path: /healthz
              port: 8080
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8080
---
apiVersion: v1
kind: Service
metadata:
  name: sample-financial-api
  namespace: irestrict-apps
spec:
  selector:
    app: sample-financial-api
  ports:
    - name: http
      port: 80
      targetPort: 8080
