apiVersion: v1
kind: ServiceAccount
metadata:
  name: sample-financial-api
  namespace: irestrict-apps
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: sample-financial-api-code
  namespace: irestrict-apps
data:
  app.py: |
    import json
    import hashlib
    import os
    import time
    import urllib.request
    from http.server import BaseHTTPRequestHandler, ThreadingHTTPServer

    OPA_ENDPOINT = os.environ.get("OPA_POLICY_ENDPOINT", "http://opa.irestrict-security.svc.cluster.local:8181/v1/data/miva/api/authz")
    SPIFFE_ID = os.environ.get("SPIFFE_ID", "spiffe://miva.local/ns/irestrict-apps/sa/sample-financial-api")
    ALLOW_BENCHMARK_BYPASS = os.environ.get("ALLOW_BENCHMARK_BYPASS", "false").lower() == "true"

    def parse_scopes(value):
        return [scope.strip() for scope in value.replace(",", " ").split() if scope.strip()]

    class Handler(BaseHTTPRequestHandler):
        def _send(self, code, payload):
            body = json.dumps(payload, indent=2).encode("utf-8")
            self.send_response(code)
            self.send_header("content-type", "application/json")
            self.send_header("content-length", str(len(body)))
            self.end_headers()
            self.wfile.write(body)

        def log_message(self, fmt, *args):
            print(json.dumps({"ts": time.time(), "client": self.client_address[0], "message": fmt % args}))

        def do_GET(self):
            if self.path == "/healthz":
                return self._send(200, {"status": "ok", "service": "sample-financial-api"})
            if self.path == "/v1/accounts":
                return self.authorize_and_respond("GET", ["v1", "accounts"], {"accounts": [{"id": "demo-001", "balance": "redacted"}]})
            if self.path == "/v1/admin/audit":
                return self.authorize_and_respond("GET", ["v1", "admin", "audit"], {"audit": "authorized_demo"})
            return self._send(404, {"error": "not_found"})

        def do_POST(self):
            if self.path == "/v1/payments":
                length = int(self.headers.get("content-length", "0"))
                body = self.rfile.read(length) if length else b""
                return self.authorize_and_respond("POST", ["v1", "payments"], {"payment": "accepted_for_demo"}, body)
            return self._send(404, {"error": "not_found"})

        def authorize_and_respond(self, method, path_parts, success_payload, body=b""):
            correlation_id = self.headers.get("x-correlation-id", "missing")[:128]
            request_path = "/" + "/".join(path_parts)
            body_sha256 = hashlib.sha256(body).hexdigest()
            proof_method = self.headers.get("x-demo-proof-method", method)
            proof_uri = self.headers.get("x-demo-proof-uri", request_path)
            proof_body_sha256 = self.headers.get("x-demo-proof-body-sha256", body_sha256)
            binding_valid = (
                proof_method == method
                and proof_uri == request_path
                and proof_body_sha256 == body_sha256
            )
            benchmark_response = self.headers.get("x-benchmark-response", "false").lower() == "true"
            benchmark_bypass = (
                ALLOW_BENCHMARK_BYPASS
                and benchmark_response
                and self.headers.get("x-benchmark-bypass", "false").lower() == "true"
            )
            input_doc = {
                "input": {
                    "method": method,
                    "path": path_parts,
                    "claims": {"scope": parse_scopes(self.headers.get("x-demo-scope", ""))},
                    "spiffe_id": self.headers.get("x-demo-spiffe-id", SPIFFE_ID),
                    "dpop": {
                        "valid": self.headers.get("x-demo-dpop", "false").lower() == "true" and binding_valid,
                        "binding_valid": binding_valid,
                    },
                    "mtls": {"verified": self.headers.get("x-demo-mtls", "false").lower() == "true"},
                    "risk": {"level": self.headers.get("x-demo-risk", "low")},
                }
            }
            if benchmark_bypass:
                allowed = True
                deny_reason = []
            else:
                try:
                    data = json.dumps(input_doc).encode("utf-8")
                    req = urllib.request.Request(OPA_ENDPOINT, data=data, headers={"content-type": "application/json"}, method="POST")
                    with urllib.request.urlopen(req, timeout=3) as response:
                        decision = json.loads(response.read().decode("utf-8"))
                    allowed = bool(decision.get("result", {}).get("allow", False))
                    deny_reason = decision.get("result", {}).get("deny_reason", [])
                except Exception as exc:
                    self.audit(correlation_id, method, request_path, input_doc, "error", ["policy_engine_unavailable"])
                    return self._send(503, {"error": "policy_engine_unavailable", "correlation_id": correlation_id})
            if not allowed:
                self.audit(correlation_id, method, request_path, input_doc, "deny", deny_reason)
                return self._send(403, {"decision": "deny", "deny_reason": deny_reason, "correlation_id": correlation_id})
            if benchmark_response:
                payload = success_payload
            else:
                payload = {"decision": "allow", "policy": "OPA", "workload_identity": input_doc["input"]["spiffe_id"], "correlation_id": correlation_id}
                payload.update(success_payload)
            self.audit(correlation_id, method, request_path, input_doc, "allow", [])
            return self._send(200, payload)

        def audit(self, correlation_id, method, path, input_doc, decision, reasons):
            print(json.dumps({
                "event": "authorization_decision",
                "ts": time.time(),
                "correlation_id": correlation_id,
                "method": method,
                "path": path,
                "workload_identity": input_doc["input"]["spiffe_id"],
                "scopes": input_doc["input"]["claims"]["scope"],
                "decision": decision,
                "decision_reason": reasons,
            }), flush=True)

    if __name__ == "__main__":
        ThreadingHTTPServer(("0.0.0.0", 8080), Handler).serve_forever()
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: sample-financial-api
  namespace: irestrict-apps
spec:
  replicas: 2
  selector:
    matchLabels:
      app: sample-financial-api
  template:
    metadata:
      labels:
        app: sample-financial-api
        miva.openclaw.io/workload: protected-api
    spec:
      serviceAccountName: sample-financial-api
      containers:
        - name: api
          image: python:3.12-alpine
          imagePullPolicy: IfNotPresent
          command: ["python", "/app/app.py"]
          ports:
            - containerPort: 8080
          env:
            - name: OTEL_EXPORTER_OTLP_ENDPOINT
              value: http://otel-collector.irestrict-observability.svc.cluster.local:4318
            - name: OPA_POLICY_ENDPOINT
              value: http://opa.irestrict-security.svc.cluster.local:8181/v1/data/miva/api/authz
            - name: ALLOW_BENCHMARK_BYPASS
              value: "true"
          volumeMounts:
            - name: app-code
              mountPath: /app
          readinessProbe:
            httpGet:
              path: /healthz
              port: 8080
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8080
      volumes:
        - name: app-code
          configMap:
            name: sample-financial-api-code
---
apiVersion: v1
kind: Service
metadata:
  name: sample-financial-api
  namespace: irestrict-apps
spec:
  selector:
    app: sample-financial-api
  ports:
    - name: http
      port: 80
      targetPort: 8080
