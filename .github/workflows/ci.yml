name: repository-validation

on:
  pull_request:
  push:
    branches: [main, post-recovery-hardening-20260814]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.15.8
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements.txt
      - run: bash -n scripts/*.sh
      - run: python -m py_compile scripts/*.py
      - run: terraform fmt -check -recursive terraform
      - run: terraform -chdir=terraform/envs/lab init -backend=false -input=false
      - run: terraform -chdir=terraform/envs/lab validate
      - name: Reject embedded private keys
        run: |
          if grep -RIE --exclude-dir=.git --exclude-dir=evidence \
            'BEGIN (RSA |EC |OPENSSH )?PRIVATE KEY|client-key-data[[:space:]]*:[[:space:]]*[A-Za-z0-9+/]{80,}' .; then
            echo 'Potential private key material found.' >&2
            exit 1
          fi
